version: '3.8'

services:
  # MySQL数据库服务
  db:
    image: mysql:8.0
    container_name: salary_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salary_management
      MYSQL_ROOT_HOST: '%'
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - salary_network

  # FastAPI后端服务
  backend:
    build: ./backend
    container_name: salary_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/salary_management?charset=utf8mb4
    networks:
      - salary_network

  # Vue前端服务
  frontend:
    build: ./frontend
    container_name: salary_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - salary_network

volumes:
  mysql_data:
    driver: local

networks:
  salary_network:
    driver: bridge
